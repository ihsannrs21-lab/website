<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Top-Up Belajar</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0051cc; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Top-Up Game Sederhana</h2>
        <form onsubmit="handleTopUp(event)">
            <label>User ID Game:</label>
            <input type="text" id="userid" placeholder="Masukkan User ID" required>
            
            <label>Pilih Nominal:</label>
            <select id="item">
                <option value="86">86 Diamonds - Rp 20.000</option>
                <option value="172">172 Diamonds - Rp 40.000</option>
            </select>

            <button type="submit">Proses Top-Up</button>
        </form>
        <p id="result" style="color: green; font-weight: bold;"></p>
    </div>

    <script>
        function handleTopUp(event) {
            event.preventDefault();
            const id = document.getElementById('userid').value;
            const item = document.getElementById('item').value;
            document.getElementById('result').innerText = `Berhasil! Pesanan ${item} Diamonds untuk ID (${id}) sedang diproses.`;
        }
    </script>

</body>
</html>
