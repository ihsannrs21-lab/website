<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Up Game Ala Ourastore</title>
    <style>
        /* CSS RESET & THEME DARK MODE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #12141d;
            color: #ffffff;
            padding-bottom: 50px;
        }

        /* NAVBAR */
        .navbar {
            background-color: #1e2230;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2b3042;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ff9900;
        }
        .logo span {
            color: #ffffff;
        }

        /* HERO / BANNER */
        .hero {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .banner {
            background: linear-gradient(135deg, #1e2230, #2b3042);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            border: 1px solid #ff9900;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.15);
        }
        .banner h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .banner p {
            color: #a0a5b5;
            font-size: 14px;
        }

        /* CONTAINER UTAMA */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #ff9900;
            padding-left: 10px;
        }

        /* GRID GAME (OURASTORE STYLE) */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .game-card {
            background-color: #1e2230;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2b3042;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            text-align: center;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #ff9900;
        }
        .game-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .game-card h3 {
            font-size: 14px;
            padding: 10px 5px;
            color: #e1e1e1;
        }

        /* FORM CHECKOUT POPUP / CARD */
        .checkout-section {
            display: none;
            background-color: #1e2230;
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            border: 1px solid #2b3042;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #a0a5b5;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: #12141d;
            border: 1px solid #2b3042;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #ff9900;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #ff9900;
            color: #12141d;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #e68a00;
        }
        #result {
            margin-top: 15px;
            color: #00ff88;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">MY<span>STORE</span></div>
    </div>

    <!-- BANNER PROMO -->
    <div class="hero">
        <div class="banner">
            <h1>Top Up Game Murah & Cepat</h1>
            <p>Proses Otomatis 24 Jam Tanpa Antri</p>
        </div>
    </div>

    <!-- SEKSI PILIH GAME -->
    <div class="container">
        <h2 class="section-title">PILIH GAME</h2>
        <div class="game-grid">
            <div class="game-card" onclick="selectGame('Mobile Legends')">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400" alt="Mobile Legends">
                <h3>Mobile Legends</h3>
            </div>
            <div class="game-card" onclick="selectGame('Free Fire')">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400" alt="Free Fire">
                <h3>Free Fire</h3>
            </div>
            <div class="game-card" onclick="selectGame('PUBG Mobile')">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400" alt="PUBG Mobile">
                <h3>PUBG Mobile</h3>
            </div>
            <div class="game-card" onclick="selectGame('Valorant')">
                <img src="https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=400" alt="Valorant">
                <h3>Valorant</h3>
            </div>
        </div>

        <!-- SEKSI FORM TRANSAKSI -->
        <div class="checkout-section" id="checkout">
            <h2 class="section-title" id="selected-game-title">Form Top-Up</h2>
            <form onsubmit="handleTopUp(event)">
                <div class="form-group">
                    <label>1. Masukkan User ID / Zone ID</label>
                    <input type="text" id="userid" placeholder="Contoh: 12345678 (1234)" required>
                </div>
